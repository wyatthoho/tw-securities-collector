[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-securities-collector"
version = "0.1.0"
description = "Crawl and plot the data from Taiwan stock exchange weighted index."
authors = [{ name = "wyatthoho", email = "wyatthoho@gmail.com" }]
dependencies = [
    "beautifulsoup4 >= 4.12.0",
    "requests >= 2.28.2",
    "pandas >= 1.5.3",
    "psycopg2-binary >= 2.9.9",
    "python-dotenv >= 1.2.2",
]
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }

[project.scripts]
collector = "collector.main:main"

[tool.setuptools.packages.find]
where = ["src"]
